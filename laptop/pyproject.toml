[project]
name = "iotel-laptop-gcs"
version = "0.1.0"
description = "IoTEL Laptop Ground Control Station"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "pymavlink>=2.4.40",
    "pyserial>=3.5",
    "requests>=2.28",
]

[project.optional-dependencies]
voice = [
    "SpeechRecognition>=3.10",
    "pyaudio>=0.2.14",
]

[tool.uv]
package = false
